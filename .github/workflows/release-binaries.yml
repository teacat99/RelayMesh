name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Cross-Platform Binaries
    # 私有开发库不产出公开 Release（其 Actions 额度与 Secrets 不用于发布）
    if: ${{ github.repository == 'teacat99/RelayMesh' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 1.26：x/net、x/crypto 的安全修复要求 go 1.26.0，且上游已不再给 1.25 回补标准库 HTTP/2 漏洞修复；
          # check-latest 保证取到最新补丁版，而不是 runner 缓存里的旧补丁。
          go-version: '1.26'
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Build Frontend Assets
        run: |
          pnpm --dir frontend install
          pnpm --dir frontend run build

      - name: Cross-compile Go Binaries
        run: |
          mkdir -p dist
          # 「Agent 侧代码指纹」（算法见 internal/agentrev）：Agent 自报它，服务端据此判断主机「要不要升级」。
          # 计算失败要让构建失败（bash -e），不能悄悄退回空指纹。cmd/relaymesh-hook 没有 main.rev 变量，链接器会忽略它。
          REV="$(go run ./cmd/agentrev)"
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }} -X main.rev=${REV}"

          echo "🔨 Building Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/relaymesh-linux-amd64 ./cmd/relaymesh

          echo "🔨 Building Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/relaymesh-linux-arm64 ./cmd/relaymesh

          echo "🔨 Building macOS amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/relaymesh-darwin-amd64 ./cmd/relaymesh

          echo "🔨 Building macOS arm64 (Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/relaymesh-darwin-arm64 ./cmd/relaymesh

          echo "🔨 Building Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/relaymesh-windows-amd64.exe ./cmd/relaymesh

          # 终端 Agent：不含前端与 Web 服务，体积小，供 install.sh / install.ps1 的 agent 子命令与手动下载使用
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "${os}" = "windows" ]; then ext=".exe"; fi
            echo "🔨 Building relaymesh-agent ${os}/${arch}..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -ldflags="${LDFLAGS}" -o "dist/relaymesh-agent-${os}-${arch}${ext}" ./cmd/relaymesh-agent
            echo "🔨 Building relaymesh-hook ${os}/${arch}..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -ldflags="${LDFLAGS}" -o "dist/relaymesh-hook-${os}-${arch}${ext}" ./cmd/relaymesh-hook
          done

          echo "📦 Generating SHA256 Checksums..."
          cd dist
          sha256sum relaymesh-* > checksums.txt
          cd ..

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Release 说明取自 CHANGELOG.md 里与标签同版本号的那一节：从「## [X.Y.Z]」之后，
          # 到下一个「## [」或文末的链接引用块（「[X.Y.Z]: https://…」）之前。
          # 预发布标签（版本号带 -，如 v2.0.0-rc.1）没有自己的小节时取「## [Unreleased]」（预览版发布的就是尚未定版的那一批变化），
          # 并在最前面加两行预发布提示（scripts/test-release-notes.sh 逐字节比对：提示之后的正文 == scripts/release-notes.sh 的输出）。
          # 取不到（没有这一节、手动触发）就留空，下一步退回自动生成的说明，不会挡住发布。
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          case "${VERSION%%+*}" in *-*) PRERELEASE=true ;; esac
          section() {
            awk -v v="$1" '
              /^## \[/ || /^\[[^]]+\]: / {
                if (found) exit
                if (index($0, "## [" v "]") == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md 2>/dev/null || true
          }
          has_heading() {
            awk -v v="$1" 'index($0, "## [" v "]") == 1 { f = 1; exit } END { exit f ? 0 : 1 }' CHANGELOG.md 2>/dev/null
          }
          KEY="${VERSION}"
          if [ "${PRERELEASE}" = true ] && ! has_heading "${VERSION}"; then
            KEY="Unreleased"
          fi
          section "${KEY}" > release-notes.md
          if [ "${PRERELEASE}" = true ]; then
            {
              printf '> **预发布版本（预览）**：功能与行为可能在正式版之前调整，不建议用于生产。Docker 镜像标签为 `%s`；`latest` 镜像与 `install.sh` 默认下载的「最新正式版」不受影响。\n\n' "${VERSION}"
              cat release-notes.md
            } > release-notes.tmp
            mv release-notes.tmp release-notes.md
          fi
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "📝 Release notes taken from CHANGELOG.md section [${KEY}] ($(wc -l < release-notes.md) lines)"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "📝 No CHANGELOG.md section for [${VERSION}] — falling back to auto-generated notes"
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 有 CHANGELOG 小节时，它放在最前面，自动生成的「What's Changed」接在后面；没有时只有自动生成的说明
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          # 版本号带 -（v2.0.0-rc.1 这类预览版）标成「预发布」：GitHub 的 releases/latest 不会指向它，
          # install.sh / hook 安装器的回退下载（releases/latest/download）仍拿到上一个正式版。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/relaymesh-linux-amd64
            dist/relaymesh-linux-arm64
            dist/relaymesh-darwin-amd64
            dist/relaymesh-darwin-arm64
            dist/relaymesh-windows-amd64.exe
            dist/relaymesh-agent-linux-amd64
            dist/relaymesh-agent-linux-arm64
            dist/relaymesh-agent-darwin-amd64
            dist/relaymesh-agent-darwin-arm64
            dist/relaymesh-agent-windows-amd64.exe
            dist/relaymesh-hook-linux-amd64
            dist/relaymesh-hook-linux-arm64
            dist/relaymesh-hook-darwin-amd64
            dist/relaymesh-hook-darwin-arm64
            dist/relaymesh-hook-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
